[project]
name = "aircastle-api"
version = "0.1.0"
description = "The Aircastle HTTP API."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "fastapi-cli>=0.0.34",
    "logfire[fastapi,httpx,sqlalchemy]>=6.0.1",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.0.58,<2.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.fastapi]
entrypoint = "aircastle_api.main:app"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PT",
    "PTH", "TID", "ASYNC", "S", "FAST", "PERF", "PIE", "PL", "RUF",
]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
